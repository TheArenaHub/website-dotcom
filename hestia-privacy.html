<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Privacy Policy — Arena Hestia, The Arena Hub Ltd. UK GDPR compliant.">
<title>Privacy Policy — Arena Hestia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:   #1B263B;
  --gold:   #C5A059;
  --gold-l: rgba(197,160,89,.14);
  --light:  #F5F7FA;
  --mid:    #E0E4EB;
  --muted:  #6B7280;
  --white:  #ffffff;
  --radius: 14px;
  --shadow: 0 4px 28px rgba(27,38,59,.10);
  --nav-h:  68px;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  color: var(--navy);
  background: var(--white);
  line-height: 1.7;
}
h1, h2, h3 { font-family: 'Rajdhani', 'Segoe UI', sans-serif; line-height: 1.2; }
a { text-decoration: none; color: inherit; }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy);
  height: var(--nav-h);
  display: flex; align-items: center;
  padding: 0 5%;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}
.nav-brand { display: flex; align-items: center; gap: 12px; flex: 1; }
.nav-logo {
  width: 38px; height: 38px;
  background: rgba(197,160,89,.18);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-name { font-family: 'Rajdhani', sans-serif; color: var(--white); font-size: 1.2rem; font-weight: 700; letter-spacing: .3px; }
.nav-name span { color: var(--gold); }
.nav-home {
  color: rgba(255,255,255,.78); font-size: .9rem; font-weight: 500;
  padding: 8px 20px; border: 1.5px solid rgba(197,160,89,.5);
  border-radius: 8px; color: var(--gold);
  transition: background .15s;
}
.nav-home:hover { background: var(--gold-l); }

/* ── PAGE HEADER ── */
.page-header {
  background: linear-gradient(135deg, var(--navy) 0%, #243650 100%);
  padding: 64px 5% 56px;
  text-align: center;
}
.page-header h1 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--white); font-weight: 700; margin-bottom: 12px;
}
.page-header p {
  color: rgba(255,255,255,.65); font-size: 1rem;
  max-width: 540px; margin: 0 auto;
}
.page-header .updated {
  display: inline-block;
  margin-top: 20px;
  background: rgba(197,160,89,.15);
  border: 1px solid rgba(197,160,89,.35);
  border-radius: 999px;
  padding: 4px 16px;
  font-size: .78rem; font-weight: 600;
  color: var(--gold); letter-spacing: .5px;
}

/* ── CONTENT ── */
.content-wrap {
  max-width: 780px; margin: 0 auto;
  padding: 56px 5% 72px;
}
.content-wrap h2 {
  font-size: 1.5rem; font-weight: 700;
  color: var(--navy);
  margin-top: 40px; margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--gold-l);
}
